# tencdoc-to-md 用户配置文件
#
# 使用方法：
#   1. 将本文件复制一份，命名为 config.yaml（同目录）
#   2. 按照自己的 Obsidian 路径修改下面三个字段
#   3. config.yaml 已在 .gitignore 中，不会被上传到 git
#      每次 git pull 更新代码时，config.yaml 不会被覆盖
#
# 路径说明：支持 ~ 表示用户主目录，支持绝对路径和相对路径

# ── 输入：腾讯文档 docx 存放目录 ──────────────────────────────────────────────
# 批量转换时（batch.py）会扫描此目录下所有 .docx 文件
# 单文件转换时（convert.py）此项不生效，直接在命令行指定文件路径
docx_dir: ~/Downloads/腾讯文档导出

# ── 输出：Markdown 文件存放目录 ───────────────────────────────────────────────
# 转换后的 .md 文件写入此目录
# 建议填写 Obsidian vault 内的某个子目录，例如：~/ObsidianVault/TencDocs
output_dir: ~/ObsidianVault/TencDocs

# ── 附件目录（图片存放位置）──────────────────────────────────────────────────
# 两种模式可选：
#
# 模式 A：同级子目录（默认，留空即可）
#   图片存放在每个 md 文件的同级子目录，例如：
#   TencDocs/
#   ├── 我的文档.md
#   └── 我的文档/         ← 图片在这里
#       ├── image1.png
#       └── image2.jpg
#
# 模式 B：全局附件库（填写路径）
#   所有文档的图片统一存放到一个目录，按文档名分子文件夹，例如：
#   attachments/
#   ├── 我的文档/
#   │   ├── image1.png
#   │   └── image2.jpg
#   └── 另一个文档/
#       └── image1.png
#
#   注意：使用模式 B 时，需要在 Obsidian 设置中将"附件文件夹"指向此目录
#   （Obsidian → 设置 → 文件与链接 → 附件文件夹路径）
#
attachments_dir: ""   # 留空 = 模式 A（同级子目录）
                      # 填路径 = 模式 B，例如：~/ObsidianVault/attachments
